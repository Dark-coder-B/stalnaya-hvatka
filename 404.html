<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Стальная хватка 03</title>
</head>

<body>
    <script type="text/javascript">
        (function () {
            var segmentCount = 1;
            var baseUrl = window.location.pathname.split('/').slice(0, segmentCount + 1).join('/');
            window.location.href = baseUrl + '/index.html' + window.location.search + window.location.hash;
        })();
    </script>
</body>

</html>
